[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arghandle"
version = "1.3.2"
description = "A simple, clean alternative to argparse"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "alanbutidk" }
]
keywords = ["cli", "args", "arguments", "argparse"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
[project.scripts]

arghandle = "arghandle.arghandle:Main"
